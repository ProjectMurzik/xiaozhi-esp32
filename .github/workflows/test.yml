name: Waveshare ESP32-P4 3.4C Build

on:
  push:
    branches: [ "main", "v2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Enable Debug Mode
        run: |
          echo "ACTIONS_RUNNER_DEBUG=true" >> $GITHUB_ENV
          echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
          echo "IDF_CI_BUILD=1" >> $GITHUB_ENV
          echo "CI=1" >> $GITHUB_ENV

      - name: Cache ESP-IDF and Components
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            managed_components
            esp-idf
          key: ${{ runner.os }}-esp-idf-v5.5-${{ hashFiles('main/idf_component.yml', 'esp-idf/.git/config') }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-v5.5-

      - name: Setup ESP-IDF v5.5
        run: |
          set -x
          git config --global http.postBuffer 524288000
          if [ ! -d "esp-idf" ] || [ ! -f "esp-idf/export.sh" ]; then
            rm -rf esp-idf
            git clone --depth 1 --branch release/v5.5 --shallow-submodules https://github.com/espressif/esp-idf.git
            cd esp-idf
            git submodule update --init --recursive --depth 1 --recommend-shallow --jobs 4
            cd ..
          fi
          cd esp-idf
          ./install.sh esp32p4

      - name: Create ESP32-P4 specific config
        run: |
          set -x
          # Создаем отдельный конфиг для ESP32-P4, не трогая sdkconfig.defaults
          cat > sdkconfig.defaults.esp32p4 << 'EOF'
          # ESP32-P4 Waveshare 3.4C Specific Configuration
          CONFIG_IDF_TARGET="esp32p4"
          CONFIG_IDF_TARGET_ESP32P4=y
          CONFIG_ESPTOOLPY_FLASHSIZE_32MB=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_BOOT_INIT=y
          CONFIG_SPIRAM_USE_MALLOC=y
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/16m.csv"
          CONFIG_BOARD_TYPE_WAVESHARE_ESP32_P4_WIFI6_TOUCH_LCD_3_4C=y
          CONFIG_SLAVE_IDF_TARGET_ESP32C6=y
          CONFIG_ESP_WIFI_REMOTE_ENABLED=y
          CONFIG_ESP_HOSTED_ENABLED=y
          CONFIG_COMPILER_OPTIMIZATION_PERF=y
          CONFIG_COMPILER_CXX_RTTI=y
          CONFIG_COMPILER_CXX_EXCEPTIONS=y
          CONFIG_FREERTOS_HZ=1000
          CONFIG_ESP_MAIN_TASK_STACK_SIZE=10240
          CONFIG_AUDIO_TASK_STACK_SIZE=8192
          CONFIG_LV_COLOR_DEPTH_16=y
          CONFIG_LV_COLOR_16_SWAP=y
          EOF
          
          echo "✅ Created sdkconfig.defaults.esp32p4 (main sdkconfig.defaults unchanged)"

      - name: Configure Project
        run: |
          set -x
          . ./esp-idf/export.sh
          rm -f sdkconfig sdkconfig.old
          rm -f dependencies.lock
          rm -rf build
          
          # Используем оба конфига: базовый и специфичный для P4
          # Базовый sdkconfig.defaults остается нетронутым
          if [ -f "sdkconfig.defaults.esp32p4" ]; then
            echo "Using sdkconfig.defaults + sdkconfig.defaults.esp32p4"
            cat sdkconfig.defaults.esp32p4 >> sdkconfig.defaults.merged
            if [ -f "sdkconfig.defaults" ]; then
              cat sdkconfig.defaults >> sdkconfig.defaults.merged
            fi
            mv sdkconfig.defaults.merged sdkconfig.defaults.temp
          fi

          idf.py set-target esp32p4
          idf.py reconfigure

      - name: Build Firmware
        run: |
          set -x
          . ./esp-idf/export.sh
          export CFLAGS="-Wno-error -Wno-error=maybe-uninitialized -Wno-error=deprecated-declarations"
          export CXXFLAGS="-Wno-error -Wno-error=maybe-uninitialized -Wno-error=deprecated-declarations -fpermissive -frtti"
          
          idf.py build 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "========================================="
            echo "Build failed with exit code: $BUILD_EXIT"
            echo "========================================="
            echo "=== Errors from build.log ==="
            grep -E "(error:|fatal error:|undefined reference)" build.log | head -100
            echo "========================================="
            echo "=== LAST 200 LINES ==="
            tail -n 200 build.log
            exit $BUILD_EXIT
          fi

      - name: Verify Build Artifacts
        if: success()
        run: |
          set -x
          for artifact in build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/xiaozhi.bin; do
            if [ -f "$artifact" ]; then
              echo "✅ $artifact exists"
            else
              echo "❌ MISSING $artifact"
              exit 1
            fi
          done

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-waveshare-p4-3.4c
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/xiaozhi.bin
            build/*.bin
          retention-days: 30

      - name: Upload Debug Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            build/log/
            build.log
          retention-days: 7

      - name: Cleanup temp files
        if: always()
        run: |
          rm -f sdkconfig.defaults.temp
          rm -f sdkconfig.defaults.merged
          echo "✅ Cleaned up temporary config files"
