name: Build Xiaozhi for ESP32-P4

on:
  push:
    branches: [ "main", "v2", "develop" ]
  pull_request:
    branches: [ "main", "v2" ]
  # Возможность запустить вручную из интерфейса GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Используем официальный контейнер с ESP-IDF v5.4 (как требуется в вашем проекте)
      image: espressif/idf:v5.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build firmware for ESP32-P4
        env:
          # Указываем цель сборки - ESP32-P4
          IDF_TARGET: esp32p4
        run: |
          # Устанавливаем необходимые Python зависимости
          pip install -r requirements.txt
          
          # Настраиваем проект для esp32p4 (создаёт папку build)
          idf.py set-target esp32p4
          
          # Применяем дефолтную конфигурацию для P4 из вашего проекта
          # Если у вас есть отдельный конфиг для Waveshare, можно использовать его
          if [ -f sdkconfig.defaults.esp32p4 ]; then
            cp sdkconfig.defaults.esp32p4 sdkconfig
          fi
          
          # Сборка проекта
          idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-p4-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/xiaozhi.bin
            build/flash_args
      - name: Prepare OTA package
        run: |
          # Создаем файл для OTA обновления (опционально)
          cd build
          python ../scripts/ota/ota_create.py --input xiaozhi.bin --output xiaozhi-ota.bin
          cd ..
          
      - name: Upload OTA package
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-p4-ota
          path: build/xiaozhi-ota.bin
