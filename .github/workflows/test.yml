name: Build Xiaozhi for Waveshare ESP32-P4

on:
  push:
    branches: [ "main", "v2", "develop" ]
    paths:
      - 'main/boards/waveshare/esp32-p4-wifi6-touch-lcd/**'
      - 'main/**'
      - 'components/**'
  pull_request:
    branches: [ "main", "v2" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
      options: --user root
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      
      - name: Install Python dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip
          pip3 install --upgrade pip
          if [ -f requirements.txt ]; then
            pip3 install -r requirements.txt
          fi
      
      - name: Set target and configure for Waveshare P4
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32p4
          
          # Устанавливаем конфигурацию для платы Waveshare 3.4C через menuconfig
          echo "Configuring for Waveshare ESP32-P4-WIFI6-Touch-LCD-3.4C"
          idf.py menuconfig
          
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build
      
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-waveshare-p4-3.4c
          retention-days: 30
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/xiaozhi.bin
            build/flash_args
      
      - name: Generate build info
        run: |
          echo "Build completed for Waveshare ESP32-P4-WIFI6-Touch-LCD-3.4C"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
