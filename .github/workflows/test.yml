name: Build Waveshare ESP32-P4 3.4C

on:
  push:
    branches: [main, v2, develop]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: espressif/idf:v5.5
      options: --user root
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32p4
          idf.py build
      
      - name: Upload firmware artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-waveshare-p4-3.4c
          retention-days: 30
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/xiaozhi.bin
            build/*.bin
      
      - name: Generate build report
        if: always()
        run: |
          echo "## Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ESP32-P4" >> $GITHUB_STEP_SUMMARY
          echo "- **Board:** Waveshare ESP32-P4-WIFI6-Touch-LCD-3.4C" >> $GITHUB_STEP_SUMMARY
          echo "- **ESP-IDF:** v5.5" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Commit:** $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "build" ] && [ -n "$(ls -A build/*.bin 2>/dev/null)" ]; then
            echo "### Firmware Files" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh build/*.bin 2>/dev/null | awk '{print "- " $$9 ": " $$5}' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ No firmware files found" >> $GITHUB_STEP_SUMMARY
          fi
